name: Build Android Unsigned APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build unsigned Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          # Keep the build on the repository's lockfile for reproducible artifacts.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Ensure Capacitor Android project exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/settings.gradle ]]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/gradle-wrapper.properties
            android/**/*.gradle*
            android/**/gradle.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          # Assumption: the standard Capacitor Android Gradle project exposes
          # assembleRelease. Only an explicitly *-unsigned.apk is accepted below.
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect unsigned APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/android
          found=0

          while IFS= read -r apk; do
            cp "$apk" artifact/android/
            found=1
          done < <(find android -type f -name '*-unsigned.apk' -print)

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No *-unsigned.apk was produced under android/. The release build may be signed or use a different output layout."
            exit 1
          fi

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-apk-${{ github.run_number }}
          path: artifact/android/*.apk
          if-no-files-found: error
          retention-days: 14
