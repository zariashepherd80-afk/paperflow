name: Build PWA / Web Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build web application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          # Keep the build on the repository's lockfile for reproducible artifacts.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Collect web output
        shell: bash
        run: |
          set -euo pipefail

          # Assumption: npm run build writes to one conventional web directory.
          # Check the common Capacitor/PWA layouts without changing the app source.
          output_dir=""
          for candidate in dist build www; do
            if [[ -d "$candidate" ]]; then
              output_dir="$candidate"
              break
            fi
          done

          if [[ -z "$output_dir" ]]; then
            echo "::error::No web output directory found. Expected dist/, build/, or www/ after npm run build."
            exit 1
          fi

          mkdir -p artifact/web
          cp -R "$output_dir"/. artifact/web/

      - name: Upload PWA/web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web-${{ github.run_number }}
          path: artifact/web
          if-no-files-found: error
          retention-days: 14
